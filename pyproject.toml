[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trusteq-depot-onboarding"
version = "0.1.0"
description = "TRUSTEQ case study: Secure Agentic Depot Onboarding (modular monolith, FastAPI)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Many tests use small file-backed SQLite databases: keep temp folders only for failures,
# so repeated runs do not fill the disk.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# Warnings are errors, except one known Starlette notice: starlette.testclient prefers the
# "httpx2" package, but the approved stack specifies "httpx". Revisit when upgrading Starlette.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"app/api/pages.py" = ["E501"]  # HTML/CSS literals
"scripts/demo_happy.py" = ["E501"]  # long console narration strings
